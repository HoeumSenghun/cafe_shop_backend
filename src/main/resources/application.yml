server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: cafe_shop
  datasource:
    url: jdbc:postgresql://localhost:5432/cafe_shop
    username: postgres
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    open-in-view: false

app:
  security:
    jwt:
      issuer: cafe_shop
      access-token-ttl-minutes: 20
      refresh-token-ttl-days: 30
      # Replace in production via env var: APP_SECURITY_JWT_SECRET
      secret: ${APP_SECURITY_JWT_SECRET:change-me-change-me-change-me-change-me}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true
    display-request-duration: true
    tags-sorter: alpha
    operations-sorter: alpha
    doc-expansion: list
    filter: true
  api-docs:
    path: /v3/api-docs
  override-with-generic-response: false
