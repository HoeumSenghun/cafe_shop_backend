spring.application.name=cafe_shop
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:${SERVER_PORT:8080}}

# Database override via environment variables (local or Render)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cafe_shop}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# JWT
app.security.jwt.issuer=cafe_shop
app.security.jwt.access-token-ttl-minutes=20
app.security.jwt.refresh-token-ttl-days=30
app.security.jwt.secret=${APP_SECURITY_JWT_SECRET:change-me-change-me-change-me-change-me}

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.doc-expansion=list
springdoc.swagger-ui.filter=true
springdoc.api-docs.path=/v3/api-docs
springdoc.override-with-generic-response=false
